<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAN HAN HUHMAN MAN</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#FFC896;
      color:#000;
      font-family:"Arial Black", Arial, sans-serif;
      line-height:1.4;
      padding:20px;
    }

    header {
      position:relative;
      max-width:1600px;
      margin:0 auto 30px;
      padding:20px 0 30px;
      border-bottom:8px solid #1E90FF;
      text-align:center;
    }

    .lang-toggle {
      position:absolute;
      top:0;
      right:0;
      display:flex;
      gap:8px;
    }
    .lang-toggle a {
      display:inline-block;
      font-family: Arial, sans-serif;
      font-weight:700;
      font-size:0.85rem;
      letter-spacing:0.02em;
      text-decoration:none;
      padding:5px 9px;
      border:3px solid #1E90FF;
      background:#fff;
      color:#000;
    }
    .lang-toggle a[aria-current="true"] {
      background:#880033;
      border-color:#880033;
      color:#fff;
    }

    h1 {
      font-size:clamp(1.4rem, 7vw, 6rem);
      letter-spacing:0.03em;
      white-space:nowrap;
      margin:10px 0 20px;
      color:#880033;
    }

    .links {
      display:flex;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
    }
    .links a {
      color:#000;
      text-decoration:none;
      font-size:2rem;
      padding:10px 20px;
      border:4px solid #1E90FF;
      background:#fff;
      transition:all 0.2s;
    }
    .links a:hover {
      background:#880033;
      color:#fff;
      border-color:#880033;
    }

    main { max-width:1600px; margin:0 auto; }

    .featured-release {
      position:relative;
      margin:20px 0;
      background:#fff;
      border:8px solid #1E90FF;
      padding:30px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:40px;
      flex-wrap:wrap;
    }
    .featured-info {
      display:flex;
      flex-direction:column;
      justify-content:center;
      max-width:460px;
      flex:1 1 320px;
    }
    .featured-badge {
      display:inline-block;
      background:#880033;
      color:#fff;
      font-size:1.1rem;
      letter-spacing:0.05em;
      padding:6px 14px;
      white-space:nowrap;
      margin-bottom:10px;
      align-self:flex-start;
    }
    .featured-info h2 {
      font-size:clamp(2rem, 5vw, 3.5rem);
      color:#880033;
      letter-spacing:0.03em;
      text-transform:uppercase;
      margin-bottom:10px;
    }
    .featured-info p {
      font-size:1.1rem;
      font-family:Arial, sans-serif;
      font-weight:normal;
      margin-bottom:14px;
    }
    .featured-link {
      display:inline-block;
      color:#000;
      text-decoration:none;
      font-size:1.2rem;
      padding:10px 20px;
      border:4px solid #1E90FF;
      background:#fff;
      transition:all 0.2s;
      align-self:flex-start;
    }
    .featured-link:hover {
      background:#880033;
      color:#fff;
      border-color:#880033;
    }
    .featured-player {
      display:flex;
      justify-content:center;
      align-items:center;
      flex-shrink:0;
    }
    .featured-player iframe {
      border:0;
      width:350px;
      height:470px;
      display:block;
      max-width:100%;
    }
    .featured-poster {
      height:470px;
      width:auto;
      max-width:100%;
      display:block;
      object-fit:contain;
    }

    .bandcamp-section {
      margin:40px 0;
      display:grid;
      grid-template-columns:1fr auto;
      gap:30px;
      align-items:stretch;
    }
    .bandcamp-player {
      border:8px solid #1E90FF;
      background:#fff;
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:0;
    }
    .bandcamp-player iframe {
      width:100%;
      max-width:700px;
      height:240px;
      border:0;
      display:block;
    }

    .gif-wrapper {
      border:8px solid #1E90FF;
      background:#000;
      width:380px;
      aspect-ratio:4 / 3;
      overflow:hidden;
    }
    .gif-wrapper a { display:block; width:100%; height:100%; }
    .gif-wrapper img { width:100%; height:100%; object-fit:cover; display:block; }

    .video-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(450px, 1fr));
      gap:30px;
      margin:40px 0;
    }
    .video-wrapper {
      position:relative;
      padding-bottom:56.25%;
      height:0;
      border:6px solid #1E90FF;
      background:#000;
    }
    .video-wrapper iframe {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      border:0;
    }
    .video-title {
      margin-top:10px;
      font-size:1rem;
      font-weight:bold;
      text-align:center;
    }

    @media (max-width:1100px) {
      .featured-release { flex-direction:column; text-align:center; }
      .featured-info { align-items:center; max-width:100%; }
      .featured-badge { align-self:center; }
      .featured-link { align-self:center; }
    }
    @media (max-width:768px) {
      .bandcamp-section { grid-template-columns:1fr; }
      .gif-wrapper { width:100%; max-width:100%; }
      .video-grid { grid-template-columns:1fr; }
    }
    @media (max-width:600px) {
      .links a { font-size:1.5rem; padding:8px 16px; }
      .lang-toggle { position:static; justify-content:center; margin-bottom:10px; }
    }
  </style>
</head>

<body>
  <header>
    <nav class="lang-toggle" aria-label="Language">
      <a id="lang-de" href="?lang=de">DE</a>
      <a id="lang-en" href="?lang=en">EN</a>
    </nav>

    <h1>HAN HAN HUHMAN MAN</h1>

    <div class="links">
      <a href="https://www.instagram.com/hanhanhuh/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="https://hanhanhuh.bandcamp.com/" target="_blank" rel="noopener noreferrer">BANDCAMP</a>
    </div>
  </header>

  <main>
    <section class="featured-release">
      <div class="featured-info">
        <div class="featured-badge" id="featured-badge">NEU</div>
        <h2>ANTI-SHOCK</h2>
        <p id="featured-text">Die neue EP von Han Han Huhman Man ist jetzt auf Bandcamp verfügbar.</p>
        <a class="featured-link" id="featured-link" href="https://hanhanhuh.bandcamp.com/album/anti-shock" target="_blank" rel="noopener noreferrer">Auf Bandcamp anhören</a>
      </div>
      <div class="featured-player">
        <iframe style="border:0; width:350px; height:470px;"
                src="https://bandcamp.com/EmbeddedPlayer/album=3753461134/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/transparent=true/"
                seamless title="Anti-Shock by Han Han Huhman Man">
          <a href="https://hanhanhuh.bandcamp.com/album/anti-shock">Anti-Shock by Han Han Huhman Man</a>
        </iframe>
      </div>
      <img class="featured-poster" src="tour-poster.jpg" alt="Anti-Shock Tour 2026 poster">
    </section>

    <section class="bandcamp-section">
      <div class="bandcamp-player">
        <iframe
          src="https://bandcamp.com/EmbeddedPlayer/album=2876011149/size=large/bgcol=ffffff/linkcol=1E90FF/artwork=small/transparent=true/"
          title="Bandcamp player"
          loading="lazy"
          seamless>
        </iframe>
      </div>

      <div class="gif-wrapper">
        <a href="https://phospheneparties.bandcamp.com/" target="_blank" rel="noopener noreferrer">
          <img src="dampfwolken.gif" alt="Animation">
        </a>
      </div>
    </section>

    <section class="video-grid">
      <div class="video-item">
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/pfd4g8LXhFc"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen title="Anti-Shock"></iframe>
        </div>
        <div class="video-title">Anti-Shock</div>
      </div>

      <div class="video-item">
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/ve5CYPHkW0I"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen title="Motivationshymne"></iframe>
        </div>
        <div class="video-title">Motivationshymne</div>
      </div>

      <div class="video-item">
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/5QtzXUHr81k"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen title="Kapitel 3"></iframe>
        </div>
        <div class="video-title">Kapitel 3</div>
      </div>

      <div class="video-item">
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/b3d0NmavVOQ"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen title="600 Kreuze"></iframe>
        </div>
        <div class="video-title">600 Kreuze</div>
      </div>

      <div class="video-item">
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/JeYLyGZ2arg"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen title="Sonntag und Gestern"></iframe>
        </div>
        <div class="video-title">Sonntag und Gestern</div>
      </div>

      <div class="video-item">
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/SBUzPgdd45w"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen title="Penisjob"></iframe>
        </div>
        <div class="video-title">Penisjob</div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const translations = {
        de: {
          featuredBadge: "NEU",
          featuredText: "Die neue EP von Han Han Huhman Man ist jetzt auf Bandcamp verfügbar.",
          featuredLink: "Auf Bandcamp anhören"
        },
        en: {
          featuredBadge: "NEW",
          featuredText: "The new EP by Han Han Huhman Man is out now on Bandcamp.",
          featuredLink: "Listen on Bandcamp"
        }
      };

      const params = new URLSearchParams(location.search);
      const urlLang = params.get("lang");
      const browserLang = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
      const lang = (urlLang === "de" || urlLang === "en") ? urlLang : browserLang;

      const t = translations[lang];
      document.getElementById("featured-badge").textContent = t.featuredBadge;
      document.getElementById("featured-text").textContent = t.featuredText;
      document.getElementById("featured-link").textContent = t.featuredLink;

      document.documentElement.lang = lang;

      if (lang === "de") {
        document.getElementById("lang-de").setAttribute("aria-current", "true");
      } else {
        document.getElementById("lang-en").setAttribute("aria-current", "true");
      }
    })();
  </script>
</body>
</html>
